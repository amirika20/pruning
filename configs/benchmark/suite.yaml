# The benchmark suite: every (dataset, model) the tables need.
#
# DOWNLOAD, DO NOT TRAIN. Every entry that has a published checkpoint sets
# `pretrained: true` with `training.epochs: 0`, so the job loads weights and goes
# straight to pruning. Weights cache under ~/.cache/torch (torchvision,
# torch.hub) or ~/.cache/huggingface (OPT) on first use -- warm the caches on a
# login node once, because compute nodes are often network-isolated and a job
# that has to download will fail rather than wait.
#
# Only four entries have no checkpoint to fetch and must train: the MNIST /
# Fashion-MNIST MLPs, the MNIST CNN, and the modular-arithmetic transformer.
# All four are minutes on one GPU.
#
# `family` decides arm applicability (see arms.yaml): `fc` when the prunable
# layer is an nn.Linear, `conv` when it is a Conv2d.
#
# `resources` selects the SLURM profile in scripts/slurm_*.sh.
#
# `arms_tier` picks which arms this entry runs: `all` for the full ablation grid
# (the cheap entries, which can also afford 3 seeds), `headline` for the rest.
# See the tier note at the top of arms.yaml for why that split is scientific
# rather than budgetary. Default below; --tier overrides everything.
#
# ImageNet-1k is read from the Kempner shared testbed
# (/n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k);
# override with --imagenet-root if that path moves.

entries:

  # ── trained here (no published checkpoint) ─────────────────────────────────
  - name: mnist_mlp
    arms_tier: all
    family: fc
    resources: small
    train: true
    data: {kind: mnist, params: {flatten: true, n_samples: 10000, train_ratio: 0.8}}
    model: {kind: mlp, params: {hidden_sizes: [512, 256, 128]}}
    training: {optimizer: adam, epochs: 60, lr: 1.0e-3, batch_size: 128, weight_decay: 1.0e-4}

  - name: fashion_mnist_mlp
    arms_tier: all
    family: fc
    resources: small
    train: true
    data: {kind: fashion_mnist, params: {flatten: true, n_samples: 10000, train_ratio: 0.8}}
    model: {kind: mlp, params: {hidden_sizes: [512, 256, 128]}}
    training: {optimizer: adam, epochs: 60, lr: 1.0e-3, batch_size: 128, weight_decay: 1.0e-4}

  # LeNet-5 with the LeNet-5-Caffe widths (20/50 conv, 800/500 fc) that the
  # pruning literature uses -- the stock 6/16/120/84 is close to minimal, so
  # capacity on it would be pessimistic for reasons that have nothing to do with
  # the method. `family: mixed`: two conv slots and two fully-connected ones, so
  # only arms that work on both are generated (see arms.yaml).
  #
  # NO BATCHNORM, and that is why it is here. BN standardizes the pre-activation
  # so nothing saturates, and the `saturated` arms correctly find nothing on
  # every BN entry in this suite. LeNet is where they have something to do.
  - name: mnist_lenet
    arms_tier: all
    family: mixed
    resources: small
    train: true
    data: {kind: mnist, params: {flatten: false, n_samples: 10000, train_ratio: 0.8}}
    model: {kind: lenet, params: {conv_channels: [20, 50], hidden_sizes: [800, 500]}}
    training: {optimizer: adam, epochs: 40, lr: 1.0e-3, batch_size: 128, weight_decay: 1.0e-4}

  - name: modular_transformer
    arms_tier: all
    family: fc
    resources: small
    train: true
    # GROKKING NEEDS A BUDGET, and 400 epochs (6000 steps) was seed-unstable:
    # seed 0 reached val acc 1.0000 while seeds 1 and 2 sat at chance (0.006,
    # 0.009 against 1/97 = 0.0103) and still recorded cap01 = 0.947 for all 42
    # arms, because everything is removable from a network that does nothing.
    # run_sweep now refuses a seed whose dense model is at chance.
    #
    # AdamW / lr 1e-3 / wd 1.0 / bs 512 is the canonical recipe and was not the
    # problem. train_ratio drops to 0.5 (the literature's range is 0.3-0.5; 0.8
    # is outside it) which also gives a 4x larger val split, and epochs rise to
    # 3000. VERIFIED: ratio 0.3 at 1500 epochs reached 0.9997 on seed 0 in 62s,
    # with seed 1 mid-transition at epoch 609. NOT yet verified across all three
    # seeds -- the guard is what makes a remaining failure visible rather than
    # silently excellent.
    #
    # MEASURED at 3000 epochs: seeds 1 and 2 grok (sweep AUC 0.967 / 0.987),
    # seed 0 only half-learns (AUC 0.158) and cleared the chance floor while
    # being useless to prune. require_accuracy is the criterion that actually
    # matches "prune after the val accuracy is high".
    require_accuracy: 0.9
    data: {kind: modular_add, params: {p: 97, train_ratio: 0.5}}
    model: {kind: transformer, params: {d_model: 128, n_heads: 4, n_layers: 2, d_ff: 512}}
    # epochs is a BUDGET here, not a duration: stop_at_accuracy ends training the
    # epoch val accuracy hits 0.99. At a fixed 3000, seeds 1 and 2 groked (sweep
    # AUC 0.962 / 0.986) and seed 0 reached only ~0.26 -- so raise the ceiling to
    # 8000 for the slow seed and let the fast ones stop early instead of guessing
    # a count that suits neither.
    training: {optimizer: adamw, epochs: 8000, lr: 1.0e-3, batch_size: 512,
               weight_decay: 1.0, stop_at_accuracy: 0.99}

  # ── CIFAR-10: downloaded (chenyaofo/pytorch-cifar-models via torch.hub) ────
  - name: cifar10_resnet20
    arms_tier: all
    family: conv
    resources: medium
    data: {kind: cifar10, params: {n_samples: 10000, train_ratio: 0.8, n_test: 10000}}
    model: {kind: resnet_cifar, params: {depth: 20, pretrained: true}}

  - name: cifar10_resnet56
    family: conv
    resources: medium
    data: {kind: cifar10, params: {n_samples: 10000, train_ratio: 0.8, n_test: 10000}}
    model: {kind: resnet_cifar, params: {depth: 56, pretrained: true}}

  # ── ImageNet-1k: downloaded (torchvision) ─────────────────────────────────
  # Point data.params.root at the cluster's ImageNet; n_test drives the accuracy
  # estimate, and the -1pt tolerance needs >= 2000 val images to be meaningful.
  - name: imagenet_resnet18
    family: conv
    resources: large
    data: {kind: imagenet, params: {root: /n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k, n_samples: 20000,
                                    train_ratio: 0.9, n_test: 10000, image_size: 224}}
    model: {kind: resnet_imagenet, params: {depth: 18, pretrained: true}}

  - name: imagenet_resnet50
    family: conv
    resources: large
    data: {kind: imagenet, params: {root: /n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k, n_samples: 20000,
                                    train_ratio: 0.9, n_test: 10000, image_size: 224}}
    model: {kind: resnet_imagenet, params: {depth: 50, pretrained: true}}

  - name: imagenet_mobilenetv2
    family: conv
    resources: large
    data: {kind: imagenet, params: {root: /n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k, n_samples: 20000,
                                    train_ratio: 0.9, n_test: 10000, image_size: 224}}
    model: {kind: mobilenet_v2, params: {width_mult: 1.0, pretrained: true}}

  - name: imagenet_vit_b16
    family: fc
    resources: large
    data: {kind: imagenet, params: {root: /n/holylfs06/LABS/kempner_shared/Everyone/testbed/vision/imagenet_1k, n_samples: 20000,
                                    train_ratio: 0.9, n_test: 10000, image_size: 224}}
    model: {kind: vit, params: {variant: b_16, pretrained: true}}

  # ── WikiText-2 / OPT: downloaded (HuggingFace) ────────────────────────────
  # An FFN neuron is exactly the layer of the theory, so every FC arm applies.
  # float32 footprint ~4 bytes/param: 1.3b ~5GB, 2.7b ~11GB, 6.7b ~27GB,
  # 13b ~52GB before activations.
  - name: wikitext_opt125m
    arms_tier: all
    family: fc
    resources: medium
    # n_test was null = the full official test split, ~560 chunks against the
    # 32 of n_val. Every one of the sweep's 17 evaluations pays that, turning a
    # 9s sweep into ~10 min/seed, and the unbounded batch OOMed at 53.8 GiB
    # before LM_EVAL_BATCH capped it. 128 chunks is 65k tokens -- ample for a
    # stable perplexity and for comparing arms, which all see the same subset.
    # Quote it as perplexity on a 128-chunk subset, not on the full split.
    #
    # hope/hope_exact excluded: see exclude_arms rationale in the generator.
    exclude_arms: [hope, hope_exact]
    # OFF at this width. The battery cost 1136s per seed on OPT-125m -- about
    # two thirds of the whole medium tier even restricted to headline arms --
    # because the K matrix is 3072x3072 per layer and the response SVDs scale
    # with it. The CIFAR and small-tier geometry still covers the exploratory
    # questions at a width where the numbers are readable. Set true to measure
    # it here.
    analyze_geometry: false
    data: {kind: wikitext, params: {tokenizer: facebook/opt-125m, seq_len: 512,
                                    n_train: 128, n_val: 32, n_test: 128}}
    model: {kind: opt, params: {size: 125m, pretrained: true}}

  - name: wikitext_opt350m
    arms_tier: all
    family: fc
    resources: medium
    # n_test was null = the full official test split, ~560 chunks against the
    # 32 of n_val. Every one of the sweep's 17 evaluations pays that, turning a
    # 9s sweep into ~10 min/seed, and the unbounded batch OOMed at 53.8 GiB
    # before LM_EVAL_BATCH capped it. 128 chunks is 65k tokens -- ample for a
    # stable perplexity and for comparing arms, which all see the same subset.
    # Quote it as perplexity on a 128-chunk subset, not on the full split.
    #
    # hope/hope_exact excluded: see exclude_arms rationale in the generator.
    exclude_arms: [hope, hope_exact]
    # OFF at this width. The battery cost 1136s per seed on OPT-125m -- about
    # two thirds of the whole medium tier even restricted to headline arms --
    # because the K matrix is 3072x3072 per layer and the response SVDs scale
    # with it. The CIFAR and small-tier geometry still covers the exploratory
    # questions at a width where the numbers are readable. Set true to measure
    # it here.
    analyze_geometry: false
    data: {kind: wikitext, params: {tokenizer: facebook/opt-350m, seq_len: 512,
                                    n_train: 128, n_val: 32, n_test: 128}}
    model: {kind: opt, params: {size: 350m, pretrained: true}}

  - name: wikitext_opt1.3b
    family: fc
    resources: large
    # OFF for OPT at every size -- see the 125m entry. The K matrix is one
    # square per layer in the FFN width, so it only gets worse from here:
    # 0.5 GiB per layer at 1.3b, 3.1 GiB at 13b.
    analyze_geometry: false
    data: {kind: wikitext, params: {tokenizer: facebook/opt-1.3b, seq_len: 512,
                                    n_train: 128, n_val: 32, n_test: null}}
    model: {kind: opt, params: {size: 1.3b, pretrained: true}}

  - name: wikitext_opt2.7b
    family: fc
    resources: large
    # OFF for OPT at every size -- see the 125m entry. The K matrix is one
    # square per layer in the FFN width, so it only gets worse from here:
    # 0.5 GiB per layer at 1.3b, 3.1 GiB at 13b.
    analyze_geometry: false
    data: {kind: wikitext, params: {tokenizer: facebook/opt-2.7b, seq_len: 512,
                                    n_train: 128, n_val: 32, n_test: null}}
    model: {kind: opt, params: {size: 2.7b, pretrained: true}}

  # OPT-6.7b and 13b are back in reach: the greedy pass is now O(H^2) (a cached
  # row minimum instead of rescanning the H x H matrix), so whole-model PLAN time
  # went from ~21h/~51h to ~24min/~47min. What remains is weights in memory:
  # 6.7b is 25.0 GiB in fp32 and 13b is 48.4 GiB, so 13b needs an 80GB card.
  # Ask for one explicitly when submitting xlarge -- the feature name is
  # cluster-specific, e.g.
  #     sbatch --gres=gpu:h100:1 --array=... scripts/slurm_xlarge.sh <manifest>
  # or halve the footprint by loading in bf16.
  - name: wikitext_opt6.7b
    family: fc
    resources: large
    # OFF for OPT at every size -- see the 125m entry. The K matrix is one
    # square per layer in the FFN width, so it only gets worse from here:
    # 0.5 GiB per layer at 1.3b, 3.1 GiB at 13b.
    analyze_geometry: false
    data: {kind: wikitext, params: {tokenizer: facebook/opt-6.7b, seq_len: 512,
                                    n_train: 128, n_val: 32, n_test: null}}
    # fp16 is the dtype the checkpoint was released in, so this is a
    # faithful load rather than a compromise -- and it halves 25.0 GiB
    # of resident weights. Merged-unit arms carry fp16 rounding in the
    # synthesized hyperplane; deletion-only arms do not.
    model: {kind: opt, params: {size: 6.7b, pretrained: true, dtype: float16}}

  - name: wikitext_opt13b
    family: fc
    resources: xlarge
    # OFF for OPT at every size -- see the 125m entry. The K matrix is one
    # square per layer in the FFN width, so it only gets worse from here:
    # 0.5 GiB per layer at 1.3b, 3.1 GiB at 13b.
    analyze_geometry: false
    data: {kind: wikitext, params: {tokenizer: facebook/opt-13b, seq_len: 512,
                                    n_train: 128, n_val: 32, n_test: null}}
    # fp16 is the dtype the checkpoint was released in, so this is a
    # faithful load rather than a compromise -- and it halves 48.4 GiB
    # of resident weights. Merged-unit arms carry fp16 rounding in the
    # synthesized hyperplane; deletion-only arms do not.
    model: {kind: opt, params: {size: 13b, pretrained: true, dtype: float16}}

# ── defaults applied to every generated config ──────────────────────────────
defaults:
  seeds: [0, 1, 2]
  # No fine-tuning: the tables measure the surgery, not subsequent retraining.
  finetune: {epochs: 0}
  # Pretrained entries skip training entirely.
  training_pretrained: {epochs: 0}
  arms_tier: headline
  # analyze_geometry is deliberately UNSET here so it falls through to
  # "headline arms only" in the generator. The geometry and similarity batteries
  # are exploratory and quadratic in layer width, and on the OPT-125m smoke cell
  # they took 1136s of a 1224s seed against 9s for the width sweep that is the
  # actual measurement. We read them for a handful of representative arms, not
  # for all 50 of the ablation grid. Set true/false here to force either way.
  deterministic: true
  # Lab scratch: home is quota'd and 13b OPT weights alone are ~52GB.
  # The job scripts also point TORCH_HOME/HF_HOME under here, so weights
  # and results share one tree. Override with --output-root.
  output_root: /n/netscratch/pehlevan_lab/Lab/akazeminia/pruning/results

# Seeds vary the calibration draw and the evaluation split, not the weights, for
# pretrained entries -- so one seed is enough where a download fixes the model
# AND the arm is deterministic. The big LMs get one to keep the queue honest.
seed_overrides:
  wikitext_opt2.7b: [0]
  imagenet_resnet50: [0]
  imagenet_vit_b16: [0]
  wikitext_opt6.7b: [0]
  wikitext_opt13b: [0]
