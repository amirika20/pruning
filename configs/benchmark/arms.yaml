# The pruning arms of the benchmark, declaratively.
#
# `scripts/generate_benchmark_configs.py` crosses this with suite.yaml and emits
# one runnable ExperimentConfig per (model, arm), skipping combinations the
# method refuses. Editing this file changes the benchmark; the generated configs
# are disposable.
#
# APPLICABILITY. `requires: fc` marks arms that only work where the prunable
# layer is an nn.Linear (mlp, resmlp, transformer, vit, opt). The reasons differ
# and are all deliberate refusals in the code, not gaps:
#
#   repair kernel/projection   evaluate their Grams in closed form under a
#                              Gaussian over the layer's inputs; on conv that
#                              means a patch covariance, which is both expensive
#                              (d = C_in*k*k) and misspecified for im2col
#                              patches (they are a blank-background spike plus
#                              sparse rectified foreground, not Gaussian)
#   data_free_merge, leo_pp    fully-connected by construction in both papers
#   saturated always_on        re-solves the consumer's columns, so it needs the
#                              activation Grams
#   saturated interval         needs the layer-input box, which on conv lives on
#                              patches
#
# Everything else -- every score, both dictionaries, sum and empirical repair --
# runs on conv and BatchNorm.

# ── tiers ────────────────────────────────────────────────────────────────────
#
# HEADLINE arms answer "how much can this method remove, against the
# baselines" -- Tables 2 and 3. Every other arm is ABLATION: it answers "which
# design axis matters", which is Table 4.
#
# The split is not about cost. The ledger already shows the axes COLLAPSE under
# a global repair -- the dictionary (E14), the selection criterion (E15), and
# exact_damage against delta_f (E17) -- while the repair ordering itself is
# guaranteed by nested feasible sets rather than measured. So most of the grid
# at ImageNet/OPT scale would re-confirm a structure the small models already
# establish, and it would do so at ONE seed, where a 24-cell table invites
# reading noise as signal. The ablation needs seeds, not models.
#
# Two axes are deliberately headline anyway, because at scale they are open
# questions rather than confirmations:
#   * merge vs medoid on conv -- E10/E13 found merged filters lose on
#     BatchNorm-trained conv, but from two-block toy CNNs. Whether that survives
#     on a real ImageNet backbone is untested, so both are headline.
#   * cylinder vs delta_f under a global repair -- the collapse is established
#     on MLPs; the suite entries with `arms_tier: all` (including the small
#     transformer and OPT-125m/350m) re-test it where a transformer FFN is
#     claimed to be "literally the layer of the theory".
headline:
  - random
  - magnitude_mass
  - saturated_dead_empirical
  - saturated_dead_margin
  - mash_certified
  - osscar
  - hope
  - data_free_merge
  - leo_pp
  - mash_merge_sum_cylinder          # Ours_cert: domain-only selection + sum
  - mash_merge_kernel_delta_f        # Ours_full on fully-connected layers
  - mash_merge_empirical_delta_f     # Ours_full on conv
  - mash_medoid_empirical_delta_f    # the conv recipe (medoid survivors)

# SCALE arms are the set the big models carry: ImageNet-1k backbones and OPT
# 1.3b and up, where a single MASH cell is hours and the design grid cannot be
# re-run. Two external baselines only (magnitude and OSSCAR, the strongest),
# the random floor because it is free, and MASH restricted to ONE repair --
# empirical, the OSSCAR-like global least squares, which is the best rule on
# every recorded model -- so the axes that remain open at scale are visible
# without the repair confounding them:
#   * merge vs medoid            (the dictionary; both only run where no BN)
#   * pre- vs post-activation    (cylinder vs delta_f Ward score)
#   * sampled vs Gaussian Grams  (measure, on the delta_f score: the plain arms
#                                 score from sample Grams, mash_gaussian_* from
#                                 the closed-form moments; FC only)
# Not carried: mash_certified (a different question -- it picks its own width),
# hope / leo_pp / data_free_merge (data_free_merge alone was projected at 300
# GPU-h for one opt6.7b seed). Every cell writes removals.json, so the
# OSSCAR-vs-MASH removed-unit overlap comes from these runs without a rerun
# (src.analysis.pruning_detail.overlap_from_removals).
scale:
  - random
  - magnitude_mass
  - osscar
  - mash_merge_empirical_cylinder
  - mash_medoid_empirical_cylinder
  - mash_merge_empirical_delta_f
  - mash_medoid_empirical_delta_f
  - mash_gaussian_merge_empirical_delta_f
  - mash_gaussian_medoid_empirical_delta_f

# REPAIR arms: the two selection-vs-repair experiments (decided 2026-09-09).
#   1. with vs without repair, for random, magnitude, OSSCAR and MASH (delta_f
#      Ward score from sample Grams -- the default -- AND from Gaussian
#      moments, mash_gaussian_*). "Without" is deletion of the arm's own
#      removed set: repair=none on the baselines, osscar_norepair, and
#      mash_medoid_none_delta_f. MASH's own data-free removal is the SUM rule
#      (mash_merge_sum_delta_f; mash_medoid_sum_delta_f under BatchNorm): the
#      absorbed units' columns move to the survivor with no data touched.
#   2. with vs without ridge on the shared empirical repair, for random,
#      magnitude and MASH: 1e-8 (the operating guard) vs 1e-2 (OSSCAR's
#      damping), both relative to the mean diagonal of the Gram.
# Runs on every ImageNet model, OPT-125m/350m/1.3b and the CIFAR ResNets
# (`--tier repair`); the best configuration then goes to the larger OPTs.
repair:
  - random
  - random_empirical
  - random_ridge
  - magnitude_mass
  - magnitude_mass_empirical
  - magnitude_mass_ridge
  - osscar
  - osscar_norepair
  - mash_medoid_none_delta_f
  - mash_medoid_sum_delta_f
  - mash_medoid_empirical_delta_f
  - mash_ridge_medoid_empirical_delta_f
  - mash_merge_sum_delta_f
  - mash_merge_empirical_delta_f
  - mash_ridge_merge_empirical_delta_f
  - mash_gaussian_medoid_none_delta_f
  - mash_gaussian_medoid_sum_delta_f
  - mash_gaussian_medoid_empirical_delta_f
  - mash_ridge_gaussian_medoid_empirical_delta_f
  - mash_gaussian_merge_sum_delta_f
  - mash_gaussian_merge_empirical_delta_f
  - mash_ridge_gaussian_merge_empirical_delta_f

# PAPER arms (paper/PLAN.md, decided 2026-09-10): the cells the paper's figures
# read. OSSCAR keeps its OWN repair (no osscar_ridge); every other repaired arm
# is the empirical repair at ridge 1e-2. Sampled delta_f is the default score;
# the Gaussian twins are the measure ablation on FC models. `paper_big` is the
# reduced set for OPT-2.7b/6.7b: no Gaussian ablation, no medoid variants, no
# mash_certified -- the arms the headline figures need and nothing else.
paper:
  - random
  - random_ridge
  - magnitude_mass
  - magnitude_mass_ridge
  - osscar
  - osscar_norepair
  - mash_medoid_none_delta_f
  - mash_medoid_sum_delta_f
  - mash_merge_sum_delta_f
  - mash_ridge_medoid_empirical_delta_f
  - mash_ridge_merge_empirical_delta_f
  - mash_full_medoid_empirical_delta_f
  - mash_full_medoid_empirical_cylinder
  - mash_gaussian_medoid_none_delta_f
  - mash_gaussian_medoid_sum_delta_f
  - mash_gaussian_merge_sum_delta_f
  - mash_ridge_gaussian_medoid_empirical_delta_f
  - mash_ridge_gaussian_merge_empirical_delta_f
  - mash_merge_sum_cylinder
  - mash_medoid_sum_cylinder
  - mash_ridge_merge_empirical_cylinder
  - mash_ridge_medoid_empirical_cylinder
  - mash_certified
paper_big:
  - random
  - random_ridge
  - magnitude_mass
  - magnitude_mass_ridge
  - osscar
  - osscar_norepair
  - mash_medoid_none_delta_f
  - mash_medoid_sum_delta_f
  - mash_merge_sum_delta_f
  - mash_ridge_merge_empirical_delta_f
  - mash_full_medoid_empirical_delta_f
  - mash_merge_sum_cylinder

# ── explicit arms ────────────────────────────────────────────────────────────
arms:

  # -- controls ---------------------------------------------------------------
  - name: random
    kind: random
    params: {seed: 0}
    note: "the floor: how much is removable regardless of which units go"
  - name: random_empirical
    kind: random
    params: {seed: 0, repair: empirical}
    note: "with a global repair the survivor SPAN sets capacity, so this is the
           sharpest test of whether any selection beats an arbitrary subset"
  - name: random_ridge
    kind: random
    params: {seed: 0, repair: empirical, ridge: 1.0e-2}
    note: "the same repair with OSSCAR's damping strength"

  # -- magnitude, all four norms. The gap between `mass` and the rest measures
  #    the gauge argument: a function-preserving rescale (w,b,c)->(tw,tb,c/t)
  #    changes ||w|| and ||c|| but not the product.
  - name: magnitude_mass
    kind: magnitude
    params: {norm: mass}
  - name: magnitude_w
    kind: magnitude
    params: {norm: w}
  - name: magnitude_c
    kind: magnitude
    params: {norm: c}
  - name: magnitude_l1
    kind: magnitude
    params: {norm: l1}
    note: "Li et al. ICLR 2017's filter criterion"
  - name: magnitude_mass_empirical
    kind: magnitude
    params: {norm: mass, repair: empirical}
  - name: magnitude_mass_ridge
    kind: magnitude
    params: {norm: mass, repair: empirical, ridge: 1.0e-2}

  # -- saturated: the free tier -----------------------------------------------
  - name: saturated_dead_empirical
    kind: saturated
    params: {mode: dead, criterion: empirical}
  - name: saturated_dead_margin
    kind: saturated
    params: {mode: dead, criterion: margin, kappa: 4.0}
  - name: saturated_dead_interval
    kind: saturated
    params: {mode: dead, criterion: interval}
    requires: fc
  - name: saturated_both_empirical
    kind: saturated
    params: {mode: both, criterion: margin, repair: empirical}
    requires: fc

  # -- our tolerance-driven tier ----------------------------------------------
  - name: mash_certified
    kind: mash_certified
    params: {tol: 0.05, scale: mass}
    note: "picks its own width from the certificate; sweep the tolerance, not
           the width"

  # -- external baselines -----------------------------------------------------
  - name: osscar
    kind: osscar
    params: {}
    note: "width comes from the sweep, not from params -- osscar validates that
           exactly one of prune_fraction/n_remove is set, and the sweep injects
           it per width (see src/experiments/sweep._width_params)"
  - name: osscar_norepair
    kind: osscar
    params: {repair: none}
    note: "OSSCAR's selection, deleted outright -- the selection-only control"
  - name: hope
    kind: hope
    params: {}
  - name: hope_exact
    kind: hope
    params: {exact_kernel: true}
    note: "eq. 83 truncated-bivariate cross-kernel instead of the paper's
           zero-bias arc-cosine approximation"
  - name: hope_prune_only
    kind: hope
    params: {allow_merge: false}
  - name: data_free_merge
    kind: data_free_merge
    params: {}
    requires: fc
    note: "Srinivas & Babu BMVC 2015 -- the ancestor: same gauge argument,
           keep-survivor dictionary, uncalibrated angular-vs-offset scale"
  - name: leo_pp
    kind: leo_pp
    params: {certify: empirical}
    requires: fc

# ── the MASH grid: every scoring rule x merging rule x update ────────────────
#
# score      cylinder      pre-ReLU, domain-only (needs the input box only)
#            delta_f       post-ReLU Ward form -- the operating criterion
#            exact_damage  post-ReLU plus the merged unit and the fan-out Gram
# dictionary merge         emit the new mass-weighted hyperplane
#            medoid        keep each cluster's heaviest ORIGINAL unit
# repair     sum           emit the accumulated column, no measure
#            projection    per-cluster rank-1 least squares
#            kernel        global least squares, closed-form Grams
#            empirical     the same normal equations, sample-averaged Grams
grids:
  - prefix: mash
    kind: mash
    axes:
      score: [cylinder, delta_f, exact_damage]
      dictionary: [merge, medoid]
      repair: [sum, projection, kernel, empirical]
    # closed-form Grams are the FC-only half of the repair axis
    requires_fc_when:
      repair: [projection, kernel]
    # dictionary=merge synthesizes a hyperplane whose parameters are the
    # BN-FOLDED ones, so writing it back while the paired BatchNorm still
    # applies would double-count the normalization -- mash raises
    # NotImplementedError and points at medoid, which keeps original filters and
    # their BN slots. Generating these on a BN entry only queues cells that
    # cannot run: 16 of them failed that way on the CIFAR ResNets.
    requires_nobn_when:
      dictionary: [merge]

  # repair='none' on the medoid dictionary: the selection-only control for
  # experiment 1 (sampled measure, the default).
  - prefix: mash
    kind: mash
    axes:
      score: [delta_f]
      dictionary: [medoid]
      repair: [none]

  # THE GAUSSIAN-MEASURE ABLATION: the delta_f score from closed-form
  # rectified-Gaussian moments instead of sample Grams. FC only -- on conv the
  # d x d patch covariance is both large and misspecified (E10). Was the Linear
  # default until 2026-09-10; finished cells from before were renamed to these
  # names by scripts/rename_gaussian_outputs.py.
  - prefix: mash_gaussian
    kind: mash
    fixed: {measure: gaussian}
    axes:
      score: [delta_f]
      dictionary: [medoid]
      repair: [none, sum, empirical]
    requires: fc
  - prefix: mash_gaussian            # merge has no repair='none' form
    kind: mash
    fixed: {measure: gaussian}
    axes:
      score: [delta_f]
      dictionary: [merge]
      repair: [sum, empirical]
    requires: fc
    requires_nobn_when:
      dictionary: [merge]

  # the ridge toggle on the empirical repair (experiment 2): OSSCAR's 1e-2
  # against the 1e-8 guard the plain arms use. Both measures, both dictionaries.
  - prefix: mash_ridge
    kind: mash
    fixed: {ridge: 1.0e-2}
    axes:
      score: [delta_f, cylinder]      # cylinder: the certificate tier, repaired
      dictionary: [merge, medoid]
      repair: [empirical]
    requires_nobn_when:
      dictionary: [merge]
  - prefix: mash_ridge_gaussian
    kind: mash
    fixed: {ridge: 1.0e-2, measure: gaussian}
    axes:
      score: [delta_f]
      dictionary: [merge, medoid]
      repair: [empirical]
    requires: fc
    requires_nobn_when:
      dictionary: [merge]

  # FULL-ROW RIDGE REPAIR CENTRED ON THE SUM RULE (decided 2026-09-11): the
  # medoid survivors keep their units, the absorbed columns first move onto the
  # survivor (sum rule), then the ridge repair re-solves from there using EVERY
  # calibration token (repair_rows: 0) instead of the 20000-row subsample.
  # Same 128 sequences as OSSCAR, now the same rows too. lam -> inf returns
  # medoid+sum. Plans are shared with the other delta_f/cylinder arms.
  - prefix: mash_full
    kind: mash
    fixed: {ridge: 1.0e-2, ridge_prior: sum, repair_rows: 0}
    axes:
      score: [delta_f, cylinder]
      dictionary: [medoid]
      repair: [empirical]

  # the bias-compensation toggle, on the two repairs where it can matter
  # (a global solve already zero-means its residual, so it is ~free there)
  - prefix: mash_bias
    kind: mash
    fixed: {bias_fix: true}
    axes:
      score: [cylinder, delta_f]
      dictionary: [merge]
      repair: [sum, empirical]
    requires_nobn_when:
      dictionary: [merge]

  # the gauge-correction toggle: emitting eta_C * sum(v) makes the merged unit
  # the optimal affine surrogate; the unscaled sum overshoots its slope by
  # 1/eta_C. Only observable under the sum rule -- a repair re-solves it away.
  - prefix: mash_nogauge
    kind: mash
    fixed: {gauge_correct: false}
    axes:
      score: [cylinder, delta_f]
      dictionary: [merge]
      repair: [sum]
    requires_nobn_when:
      dictionary: [merge]

  # cylinder radius: sup-norm (the operating choice) vs the mean-square radius
  # the Ward identity is nominally stated at
  - prefix: mash_radius
    kind: mash
    fixed: {score: cylinder, radius: l2}
    axes:
      dictionary: [merge]
      repair: [sum, empirical]
    requires_nobn_when:
      dictionary: [merge]
