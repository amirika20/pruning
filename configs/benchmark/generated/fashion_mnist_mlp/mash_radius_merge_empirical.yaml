    flatten: true
    n_samples: 10000
    train_ratio: 0.8
model:
  kind: mlp
  params:
    hidden_sizes:
    - 512
    - 256
    - 128
training:
  optimizer: adam
  epochs: 60
  lr: 0.001
  batch_size: 128
  weight_decay: 0.0001
