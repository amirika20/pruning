name: fashion_mnist_mlp__mash_radius_merge_empirical
notes: 'Benchmark cell: fashion_mnist_mlp x mash_radius_merge_empirical. Trained here (no published checkpoint).
  Generated by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml, not
  this file.'
data:
  kind: fashion_mnist
