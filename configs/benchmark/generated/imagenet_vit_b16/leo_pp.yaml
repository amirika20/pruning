name: imagenet_vit_b16__leo_pp
notes: 'Benchmark cell: imagenet_vit_b16 x leo_pp. Pretrained weights downloaded; no training. Generated
  by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml, not this file.'
data:
  kind: imagenet
  params:
    root: /PLACEHOLDER
    n_samples: 20000
    train_ratio: 0.9
    n_test: 10000
    image_size: 224
model:
  kind: vit
  params:
    variant: b_16
    pretrained: true
training:
  epochs: 0
pruning:
  methods:
  - kind: leo_pp
    params:
      certify: empirical
finetune:
  epochs: 0
seeds:
- 0
output_root: outputs/benchmark
analyze_geometry: true
deterministic: true
