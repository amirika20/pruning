name: imagenet_mobilenetv2__mash_medoid_empirical_cylinder
notes: 'Benchmark cell: imagenet_mobilenetv2 x mash_medoid_empirical_cylinder. Pretrained weights downloaded;
  no training. Generated by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml,
  not this file.'
data:
  kind: imagenet
  params:
    root: /PLACEHOLDER
    n_samples: 20000
    train_ratio: 0.9
    n_test: 10000
    image_size: 224
model:
  kind: mobilenet_v2
  params:
    width_mult: 1.0
    pretrained: true
training:
  epochs: 0
pruning:
  methods:
  - kind: mash
    params:
      dictionary: medoid
      repair: empirical
      score: cylinder
finetune:
  epochs: 0
seeds:
- 0
- 1
- 2
output_root: outputs/benchmark
analyze_geometry: true
deterministic: true
