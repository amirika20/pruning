name: mnist_cnn__mash_merge_sum_exact_damage
notes: 'Benchmark cell: mnist_cnn x mash_merge_sum_exact_damage. Trained here (no published checkpoint).
  Generated by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml, not
  this file.'
data:
  kind: mnist
  params:
    flatten: false
    n_samples: 10000
    train_ratio: 0.8
model:
  kind: cnn
  params:
    hidden_sizes:
    - 32
    - 64
    - 128
    input_channels: 1
training:
  optimizer: adam
  epochs: 40
  lr: 0.001
  batch_size: 128
  weight_decay: 0.0001
pruning:
  methods:
  - kind: mash
    params:
      dictionary: merge
      repair: sum
      score: exact_damage
finetune:
  epochs: 0
seeds:
- 0
- 1
- 2
output_root: outputs/benchmark
analyze_geometry: true
deterministic: true
