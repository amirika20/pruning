name: modular_transformer__random
notes: 'Benchmark cell: modular_transformer x random. Trained here (no published checkpoint). Generated
  by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml, not this file.'
data:
