  - kind: random
    params:
      seed: 0
finetune:
  epochs: 0
seeds:
- 0
- 1
- 2
output_root: /n/netscratch/pehlevan_lab/Lab/akazeminia/pruning/results
analyze_geometry: true
deterministic: true
eval_split: val
require_accuracy: 0.9
