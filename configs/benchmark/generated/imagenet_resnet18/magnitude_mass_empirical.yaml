name: imagenet_resnet18__magnitude_mass_empirical
notes: 'Benchmark cell: imagenet_resnet18 x magnitude_mass_empirical. Pretrained weights downloaded; no
  training. Generated by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml,
  not this file.'
data:
  kind: imagenet
  params:
    root: /PLACEHOLDER
    n_samples: 20000
    train_ratio: 0.9
    n_test: 10000
    image_size: 224
model:
  kind: resnet_imagenet
  params:
    depth: 18
    pretrained: true
training:
  epochs: 0
pruning:
  methods:
  - kind: magnitude
    params:
      norm: mass
      repair: empirical
finetune:
  epochs: 0
seeds:
- 0
- 1
- 2
output_root: outputs/benchmark
analyze_geometry: true
deterministic: true
