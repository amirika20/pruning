name: mnist_lenet__mash_merge_sum_cylinder
notes: 'Benchmark cell: mnist_lenet x mash_merge_sum_cylinder. Trained here (no published checkpoint).
  Generated by scripts/generate_benchmark_configs.py -- edit configs/benchmark/{suite,arms}.yaml, not
  this file.'
data:
  kind: mnist
  params:
    flatten: false
    n_samples: 10000
    train_ratio: 0.8
model:
  kind: lenet
  params:
    conv_channels:
    - 20
    - 50
    hidden_sizes:
    - 800
    - 500
training:
  optimizer: adam
  epochs: 40
  lr: 0.001
  batch_size: 128
  weight_decay: 0.0001
pruning:
  methods:
  - kind: mash
    params:
      dictionary: merge
      repair: sum
      score: cylinder
finetune:
  epochs: 0
seeds:
- 0
- 1
- 2
output_root: /n/netscratch/pehlevan_lab/Lab/akazeminia/pruning/results
analyze_geometry: true
deterministic: true
eval_split: val
