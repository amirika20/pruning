name: modular_transformer
notes: "2-layer transformer on (a+b) mod 97; redundant FFN-neuron pruning only, then fine-tune"

data:
  kind: modular_add
  params:
    p: 97
    train_ratio: 0.5

model:
  kind: transformer
  params:
    d_model: 128
    n_heads: 4
    d_ff: 256
    n_layers: 2

training:
  optimizer: adamw
  epochs: 1000
  lr: 1.0e-3
  batch_size: 512
  weight_decay: 1.0
  log_every: 500

pruning:
  methods:
    - kind: redundant
      params:
        orientation_threshold: 0.1
        magnitude_threshold: 0.1

finetune:
  optimizer: adamw
  epochs: 1000
  lr: 1.0e-4
  batch_size: 512
  weight_decay: 1.0
  log_every: 200

seeds: [0]
