name: imagenette_mobilenetv2_osscar
notes: "OSSCAR one-shot channel pruning of pretrained MobileNetV2 (the paper's other vision benchmark, laptop-scale): 20% of expanded channels per inverted-residual block, no training, no fine-tuning. Measured: 99.0% -> 98.8% test acc (naive deletion of the same channels: 15.8%). Sizes via model.params.width_mult (pretrained exists for 1.0 only)."

data:
  kind: imagenet
  params:
    root: /home/amirabbas-kazeminia/Projects/neural-network-reparameterization/data_cache/imagenette2-320
    n_samples: 80        # 64 train images = OSSCAR calibration set
    train_ratio: 0.8
    n_test: 2000
    image_size: 224

model:
  kind: mobilenet_v2
  params:
    pretrained: true

training:
  epochs: 0

pruning:
  methods:
    - kind: osscar
      params:
        prune_fraction: 0.2

finetune:
  epochs: 0

seeds: [0]
