name: fashion_mnist_pixel_cnn
notes: "CNN on pixel-space Fashion-MNIST [N, 1, 28, 28]; saturated (dead-unit) filter pruning, then fine-tune"

data:
  kind: fashion_mnist
  params:
    flatten: false
    n_samples: 2000
    train_ratio: 0.8

model:
  kind: cnn
  params:
    hidden_sizes: [32, 64, 128]
    input_channels: 1

training:
  optimizer: sgd
  epochs: 500
  lr: 1.0e-3
  batch_size: 64
  weight_decay: 1.0e-4
  log_every: 10

pruning:
  methods:
    - kind: saturated
      params:
        mode: dead          # dead units are exactly free to remove
        criterion: empirical

finetune:
  optimizer: adam
  epochs: 500
  lr: 1.0e-4
  batch_size: 64
  weight_decay: 1.0e-4
  log_every: 10

seeds: [0]
