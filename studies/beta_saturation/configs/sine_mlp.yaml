name: beta_sat_sine_mlp
notes: "Case 1: tiny 1-D regression -- geometry is fully visualizable, beta is distance of the fold line from the origin"

data:
  kind: sine
  params:
    function: complex
    n_samples: 400
    noise_std: 0.05
    train_ratio: 0.8

model:
  kind: mlp
  params:
    hidden_sizes: [64, 64]

training:
  optimizer: adam
  epochs: 2000
  lr: 1.0e-3
  batch_size: 64
  log_every: 500

seeds: [0, 1, 2]
